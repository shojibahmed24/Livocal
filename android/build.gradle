allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    project.plugins.withId("com.android.library") {
        if (project.extensions.findByName("android") != null) {
            def androidExt = project.extensions.findByName("android")
            if (!androidExt.hasProperty("namespace") || androidExt.namespace == null) {
                def pkg = project.group as String
                if (!pkg || pkg == "unspecified") {
                    pkg = "com.example.${project.name.replace('-', '_')}"
                }
                androidExt.namespace = pkg
            }
            androidExt.compileSdkVersion = 36
            androidExt.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
    tasks.matching { it.name.contains("AarMetadata") }.configureEach {
        enabled = false
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
