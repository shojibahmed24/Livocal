<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E7DFF"/>
      <stop offset="1" stop-color="#3F4ED8"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22E8DC"/>
      <stop offset="1" stop-color="#00A79E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5B6CF9" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#00D4C8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00D4C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="#0A0F1E"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect x="120" y="120" width="784" height="784" rx="168" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <!-- Monogram L: indigo stem, aqua foot -->
  <rect x="392" y="318" width="124" height="388" rx="62" fill="url(#indigo)"/>
  <rect x="392" y="582" width="286" height="124" rx="62" fill="url(#aqua)"/>
  <rect x="392" y="582" width="124" height="124" rx="52" fill="url(#indigo)"/>
</svg>
