services:
  - type: web
    name: livocal-relay
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://livocal.web.app,https://livocal.firebaseapp.com,https://livocal24.web.app,https://livocal24.firebaseapp.com,https://livocal-relay.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: models/gemini-3.5-live-translate-preview
      - key: DEFAULT_VOICE
        value: Aoede
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: CRYPTO_USDT_TRC20
        sync: false
      - key: CRYPTO_USDT_BEP20
        sync: false
      - key: BINANCE_PAY_ID
        sync: false
      - key: BKASH_NUMBER
        sync: false
      - key: NAGAD_NUMBER
        sync: false

